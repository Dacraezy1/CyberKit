name: CyberKit CI & Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test CyberKit
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configure Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Ensure gradlew is executable
        run: chmod +x gradlew

      - name: 6. Run lint
        run: ./gradlew lint --continue || true

      - name: 7. Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: 8. Build release & debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: 9. Verify and rename APK
        run: |
          mkdir -p build-artifacts
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Found app-release.apk"
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/CyberKit.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "Found app-release-unsigned.apk"
            cp app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/CyberKit.apk
          else
            echo "Error: Release APK not found!"
            find app/build/outputs/ -name "*.apk" || true
            exit 1
          fi

          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Found app-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/CyberKit-debug.apk
          fi
          ls -la build-artifacts/

      - name: 10. Upload CyberKit Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberKit-Release
          path: build-artifacts/CyberKit.apk
          if-no-files-found: error

      - name: 11. Upload CyberKit Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CyberKit-Debug
          path: build-artifacts/CyberKit-debug.apk
          if-no-files-found: warn
